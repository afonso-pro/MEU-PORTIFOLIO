<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada - Afonso Muena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .success-container {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 50px 30px;
            border-radius: 20px;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.1);
        }
        .icon {
            font-size: 60px;
            color: #ff6600;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 800;
        }
        h1 span {
            color: #ff6600;
        }
        p {
            color: #aaaaaa;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-voltar {
            background-color: #ff6600;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
        }
        .btn-voltar:hover {
            background-color: #e65c00;
        }
    </style>
</head>
<body>

    <div class="success-container">
        <div class="icon">✉️</div>
        <h1>MENSAGEM <span>ENVIADA!</span></h1>
        <p>Muito obrigado pelo seu contacto, Afonso Muena recebeu a sua mensagem com sucesso. A sua resposta será enviada para o seu e-mail o mais breve possível.</p>
        <a href="https://github.io" class="btn-voltar">Voltar ao Site</a>
    </div>

</body>
</html>
